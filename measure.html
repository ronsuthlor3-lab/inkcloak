<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inkcloak Measurements</title>
  <meta name="description" content="Live measurement of how far Inkcloak moves image embeddings, and how much survives JPEG and resizing.">
  <link rel="icon" href="web/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="web/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="web/icon.svg" alt="" width="36" height="36">
      <div>
        <h1>Inkcloak <span class="badge">experimental</span></h1>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
    </div>
    <div class="controls-top">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="th">ไทย</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <button type="button" class="icon-btn" id="theme"></button>
    </div>
  </header>

  <section class="warning" role="note" aria-labelledby="warn-title">
    <h2 id="warn-title"><span aria-hidden="true">⚠</span> <span data-i18n="warnTitle"></span></h2>
    <ul>
      <li data-i18n="warn1"></li>
      <li data-i18n="warn2"></li>
      <li><span data-i18n="warn3"></span>
        <a href="https://glaze.cs.uchicago.edu/" target="_blank" rel="noopener">Glaze</a> ·
        <a href="https://nightshade.cs.uchicago.edu/" target="_blank" rel="noopener">Nightshade</a></li>
    </ul>
  </section>

  <nav class="tabs">
    <a href="index.html" data-i18n="navTool"></a>
    <a href="measure.html" aria-current="page" data-i18n="navMeasure"></a>
  </nav>

  <main>
    <div class="card">
      <h2 data-i18n="mTitle"></h2>
      <p data-i18n="mIntro"></p>
      <p class="small muted" data-i18n="mHow"></p>
      <p class="small muted" data-i18n="mCaveat"></p>
      <label class="field"><span class="small" data-i18n="mAddOwn"></span>
        <input type="file" id="own" accept="image/png,image/jpeg,image/webp" multiple></label>
      <div class="samples" style="justify-content:flex-start">
        <select id="steps" aria-label="steps">
          <option value="20">20</option>
          <option value="40" selected>40</option>
        </select>
        <span class="small muted" data-i18n="mSteps"></span>
        <button type="button" id="run" data-i18n="mRun"></button>
        <button type="button" class="secondary" id="copy" hidden data-i18n="mCopy"></button>
      </div>
      <progress id="progress" max="1" value="0" hidden></progress>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </div>

    <div class="card" id="out" hidden>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th data-i18n="mColEps"></th><th data-i18n="mColModel"></th><th data-i18n="mColCond"></th>
            <th data-i18n="mColShift"></th><th data-i18n="mColRand"></th><th data-i18n="mColDecoy"></th>
            <th data-i18n="mColQuality"></th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <footer>
    <span data-i18n="footer"></span> ·
    <a href="https://github.com/ronsuthlor3-lab/inkcloak">GitHub</a>
  </footer>

  <script src="vendor/tf.min.js"></script>
  <script type="module" src="js/measure.js"></script>
</body>
</html>
